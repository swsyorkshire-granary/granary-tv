name: Publish Granary TV (GitHub Pages)
# Publishes whatever is on the "live" branch. The live branch is only updated with the owner's say-so.
# (Runs from main because GitHub only lets the default branch deploy to Pages; it checks out "live".)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', '.publish']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
