name: Build Fire TV app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Save APK (or build log) back to the repo
        if: always()
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk site/app.apk
            echo "OK $(date -u)" > build-output/status.txt
          else
            echo "FAILED $(date -u)" > build-output/status.txt
          fi
          tail -150 build.log > build-output/build.log || true
          git config user.name "granary-build-bot"
          git config user.email "granary-build-bot@users.noreply.github.com"
          git add -A site/app.apk build-output 2>/dev/null || git add -A build-output
          git commit -m "Fire TV app build: $(cat build-output/status.txt) [skip ci]" || exit 0
          git push
