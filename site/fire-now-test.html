<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOW Fire Stick test</title>
<style>
html{font-size:calc(100vw / 80)}
body{font:1rem/1.35 Inter,-apple-system,Roboto,sans-serif;background:#fafaf9;color:#14161a;margin:0;padding:1.4rem 2rem}
h1{font-size:1.6rem;margin:0 0 .3rem}p{color:#4b5563;margin:0 0 1rem}
.row{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.8rem;align-items:center;background:#fff;border-radius:.8rem;padding:.6rem .9rem;margin:0 0 .45rem;box-shadow:0 1px 2px #0001}
.n{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:999px;background:#ff5a3c;color:#fff;font-weight:800}
.lab b{display:block}.lab small{color:#6b7280;font-size:.75rem;word-break:break-all}
.res{font-size:.78rem;color:#0f766e}.res.no{color:#b42318}
button{font:inherit;font-weight:700;padding:.5rem 1rem;border-radius:999px;border:0;background:#14161a;color:#fff}
button:focus{outline:4px solid #ff5a3c;outline-offset:2px}
#msg{margin-top:.6rem;font-weight:700}
</style></head><body>
<h1>NOW on the Fire Stick – link test (FBI)</h1>
<p>Each row says whether the NOW app accepts that kind of link (✓ green). Press <b>Try</b> on each, press Back to return here, and note which numbers open <b>FBI</b> itself. A photo of this screen helps too.</p>
<div id="list"></div><div id="msg"></div>
<script>
const id = 'iYEQYZDoViN8Rrwj3GQ1Cq', PKG = 'com.bskyb.nowtv.beta';
const dd = a => encodeURIComponent(JSON.stringify({ providerSeriesId: id, type: 'SERIES', action: a || 'PDP' }));
const T = [
  ['App link nowtv:// (works on iPad)', 'nowtv://www.nowtv.com/deeplink?deeplinkData=' + dd(), 'pkg'],
  ['Web deep link https:// (works on iPad)', 'https://www.nowtv.com/deeplink?deeplinkData=' + dd(), 'pkg'],
  ['Short app link nowtv://deeplink', 'nowtv://deeplink?deeplinkData=' + dd(), 'pkg'],
  ['Programme page address', 'https://www.nowtv.com/watch/asset/fbi/' + id, 'pkg'],
  ['App link to programme page', 'nowtv://www.nowtv.com/watch/asset/fbi/' + id, 'pkg'],
  ['App link nowtv:// without naming the app', 'nowtv://www.nowtv.com/deeplink?deeplinkData=' + dd(), 'any'],
  ['App link, with pvid too', 'nowtv://www.nowtv.com/deeplink?deeplinkData=' + encodeURIComponent(JSON.stringify({ pvid: id, providerSeriesId: id, type: 'SERIES', action: 'PDP' })), 'pkg'],
  ['App link, action PLAY', 'nowtv://www.nowtv.com/deeplink?deeplinkData=' + dd('PLAY'), 'pkg'],
];
const A = window.GranaryApp;
const list = document.getElementById('list'), msg = document.getElementById('msg');
if (!A) msg.textContent = 'Open this page from the Granary TV app on the Fire Stick (⚙ Settings → NOW Fire Stick test).';
T.forEach(([label, url, mode], i) => {
  let res = '';
  try { const r = A ? JSON.parse(A.resolve(url)) : []; const now = r.filter(x => x.startsWith(PKG)); res = now.length ? '✓ NOW accepts: ' + now.map(x => x.split('/').pop().split('.').pop()).join(', ') : (r.length ? '✗ only: ' + r.join(', ').slice(0, 80) : '✗ no app accepts this'); } catch (e) { res = '?'; }
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<span class="n">${i + 1}</span><span class="lab"><b>${label}</b><small>${decodeURIComponent(url).slice(0, 120)}</small><span class="res ${/^✓/.test(res) ? '' : 'no'}">${res}</span></span>`;
  const b = document.createElement('button'); b.textContent = 'Try';
  b.onclick = () => { if (!A) return; const r = A.launch(url, mode === 'pkg' ? PKG : '', ''); msg.textContent = (i + 1) + ': ' + r; };
  row.append(b); list.append(row);
});
</script>
<script src="js/tvnav.js?v=43"></script>
</body></html>
